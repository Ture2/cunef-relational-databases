  <meta name="description" content="Interactive databases practice: ER concepts, ER to logical model transformation with instant checking, and normalization up to 5NF.">

          <span class="sr-only" id="settings-label">Settings</span>
        </button>
        <div class="settings-panel" id="settings-panel" role="dialog" aria-labelledby="settings-title" hidden>
          <p class="settings-title" id="settings-title">Settings</p>
          <div class="settings-group" role="group" aria-labelledby="set-lang-h">
            <p class="settings-h" id="set-lang-h">Language</p>
            <div class="seg">
              <button type="button" data-set="lang" data-value="es" lang="es">Español</button>
              <button type="button" data-set="lang" data-value="en" lang="en">English</button>
            </div>
          </div>
          <div class="settings-group" role="group" aria-labelledby="set-course-h">
            <p class="settings-h" id="set-course-h">Course</p>
            <div class="seg seg-col">
              <button type="button" data-set="course" data-value="relational">Relational databases</button>
              <button type="button" data-set="course" data-value="nosql">Non-relational databases</button>
            </div>
          </div>
          <div class="settings-group" role="group" aria-labelledby="set-theme-h">
            <p class="settings-h" id="set-theme-h">Theme</p>
            <div class="seg">
              <button type="button" data-set="theme" data-value="light">Light</button>
              <button type="button" data-set="theme" data-value="dark">Dark</button>
              <button type="button" data-set="theme" data-value="system">System</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>
